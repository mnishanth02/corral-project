# ==========================================================================
# Corral — Dev infrastructure ONLY (Postgres + Redis).
# Apps run on the host via `pnpm dev` (hot reload); they are NOT in this file.
# Usage: cp .env.example .env  ->  docker compose up -d  ->  pnpm db:push  ->  pnpm dev
# ==========================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: corral-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-corral}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-corral}
      POSTGRES_DB: ${POSTGRES_DB:-corral}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-corral} -d ${POSTGRES_DB:-corral}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: corral-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
